name: iOS preview preparation
on:
  pull_request:
    branches: [develop]
    paths:
      - 'native/ios-preview/**'
      - '.github/workflows/ios-preview.yml'
      - 'scripts/build-ios-preview.sh'
      - 'scripts/verify-ios-project.py'
      - 'scripts/install-ios-vault.py'
      - 'src/lib/nativeAuthStorage.ts'
      - 'src/lib/nativeSensorProbe.ts'
      - 'src/lib/nativeSensorConsistency.ts'
      - 'src/screens/NativeSensorScreen.tsx'
      - 'src/screens/GpsFieldTestScreen.tsx'
      - 'src/App.tsx'
      - 'src/lib/authRedirect.ts'
      - 'src/lib/supabaseClient.ts'
      - 'src/hooks/useSupabaseUser.ts'
      - 'src/components/auth/**'
  workflow_dispatch:
    inputs:
      build_simulator:
        description: 'Run optional macOS simulator build (uses hosted runner minutes)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Generate and validate actual native iOS project
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build non-production preview assets
        env:
          VITE_SUPABASE_URL: https://runnit-preview.invalid
          VITE_SUPABASE_ANON_KEY: preview-not-a-real-key
          VITE_ACCOUNT_DELETION_REQUESTS_ENABLED: 'false'
          VITE_LEGAL_PAGES_ENABLED: 'false'
        run: npm run build
      - name: Prepare clean native shell without modifying root dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/runnit-ios-preview/www"
          cp native/ios-preview/package.json native/ios-preview/capacitor.config.json "$RUNNER_TEMP/runnit-ios-preview/"
          cp -R dist/. "$RUNNER_TEMP/runnit-ios-preview/www/"
          cp scripts/build-ios-preview.sh scripts/verify-ios-project.py scripts/install-ios-vault.py native/ios-preview/RunnitSessionVault.swift native/ios-preview/RunnitSensorProbe.swift native/ios-preview/RunnitSprintEstimator.swift "$RUNNER_TEMP/runnit-ios-preview/"
          cd "$RUNNER_TEMP/runnit-ios-preview"
          test -f www/index.html
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high
          ./node_modules/.bin/cap --version
          bash build-ios-preview.sh --prepare-only
          python3 verify-ios-project.py --verify
          rm -rf node_modules
          tar -czf "$RUNNER_TEMP/runnit-ios-project.tar.gz" -C "$RUNNER_TEMP/runnit-ios-preview" .
      - name: Run pure Swift sprint estimator tests on Linux
        run: |
          swiftc native/ios-preview/RunnitSprintEstimator.swift native/ios-preview/tests/main.swift -o "$RUNNER_TEMP/runnit-sprint-tests"
          "$RUNNER_TEMP/runnit-sprint-tests"
      - uses: actions/upload-artifact@v4
        with:
          name: runnit-ios-preview-input
          path: ${{ runner.temp }}/runnit-ios-project.tar.gz
          retention-days: 7
          if-no-files-found: error

  simulator:
    name: Unsigned iOS simulator compilation
    if: github.event_name == 'workflow_dispatch' && inputs.build_simulator
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: runnit-ios-preview-input
          path: ${{ runner.temp }}/runnit-ios-preview
      - name: Extract checked native project
        working-directory: ${{ runner.temp }}/runnit-ios-preview
        run: tar -xzf runnit-ios-project.tar.gz && rm runnit-ios-project.tar.gz
      - name: Compile the checked native shell
        working-directory: ${{ runner.temp }}/runnit-ios-preview
        run: bash build-ios-preview.sh --compile-only
      - uses: actions/upload-artifact@v4
        with:
          name: runnit-ios-simulator-app
          path: ${{ runner.temp }}/runnit-ios-preview/derived/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 7
          if-no-files-found: error
