name: iOS preview preparation
on:
  pull_request:
    branches: [develop, main]
    # The native shell bundles the entire web application, not just native-specific files.
    paths:
      - 'native/ios-preview/**'
      - '.github/workflows/ios-preview.yml'
      - 'scripts/build-ios-preview.sh'
      - 'scripts/build-native-preview-web.mjs'
      - 'scripts/verify-ios-project.py'
      - 'scripts/smoke-ios-preview.sh'
      - 'scripts/install-ios-vault.py'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
  workflow_dispatch:
    inputs:
      build_simulator:
        description: 'Run optional macOS simulator build (uses hosted runner minutes)'
        required: true
        type: boolean
        default: false
      test_backend:
        description: 'Use explicitly configured synthetic-only Supabase test project (manual develop only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Generate and validate actual native iOS project
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test native web asset integrity checks
        run: python3 native/ios-preview/tests/test_verify_ios_assets.py
      - name: Build non-production preview assets
        if: github.event_name != 'workflow_dispatch' || !inputs.test_backend
        env:
          RUNNIT_NATIVE_BACKEND_MODE: offline
        run: node scripts/build-native-preview-web.mjs
      - name: Build connected synthetic-only test preview
        if: github.event_name == 'workflow_dispatch' && inputs.test_backend
        env:
          RUNNIT_NATIVE_BACKEND_MODE: test
          RUNNIT_NATIVE_TEST_REF: ${{ vars.RUNNIT_NATIVE_TEST_REF }}
          RUNNIT_NATIVE_TEST_DATA_CONFIRMED: ${{ vars.RUNNIT_NATIVE_TEST_DATA_CONFIRMED }}
          RUNNIT_NATIVE_TEST_PUBLISHABLE_KEY: ${{ secrets.RUNNIT_NATIVE_TEST_PUBLISHABLE_KEY }}
        run: node scripts/build-native-preview-web.mjs
      - name: Prepare clean native shell without modifying root dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/runnit-ios-preview/www"
          cp native/ios-preview/package.json native/ios-preview/package-lock.json native/ios-preview/capacitor.config.json native/ios-preview/PrivacyInfo.xcprivacy "$RUNNER_TEMP/runnit-ios-preview/"
          cp -R dist/. "$RUNNER_TEMP/runnit-ios-preview/www/"
          cp scripts/build-ios-preview.sh scripts/smoke-ios-preview.sh scripts/verify-ios-project.py scripts/install-ios-vault.py native/ios-preview/RunnitSessionVault.swift native/ios-preview/RunnitSensorProbe.swift native/ios-preview/RunnitSprintEstimator.swift "$RUNNER_TEMP/runnit-ios-preview/"
          cd "$RUNNER_TEMP/runnit-ios-preview"
          test -f www/index.html
          npm ci --ignore-scripts
          cmp package-lock.json "$GITHUB_WORKSPACE/native/ios-preview/package-lock.json"
          npm audit --audit-level=high
          ./node_modules/.bin/cap --version
          bash -n smoke-ios-preview.sh
          bash build-ios-preview.sh --prepare-only
          python3 verify-ios-project.py --verify
          rm -rf node_modules
          tar -czf "$RUNNER_TEMP/runnit-ios-project.tar.gz" -C "$RUNNER_TEMP/runnit-ios-preview" .
      - name: Run pure Swift sprint estimator tests on Linux
        run: |
          swiftc native/ios-preview/RunnitSprintEstimator.swift native/ios-preview/tests/main.swift -o "$RUNNER_TEMP/runnit-sprint-tests"
          "$RUNNER_TEMP/runnit-sprint-tests"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runnit-ios-preview-input
          path: ${{ runner.temp }}/runnit-ios-project.tar.gz
          retention-days: 7
          if-no-files-found: error

  simulator:
    name: Unsigned iOS simulator compilation and startup smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.build_simulator
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: runnit-ios-preview-input
          path: ${{ runner.temp }}/runnit-ios-preview
      - name: Extract checked native project
        working-directory: ${{ runner.temp }}/runnit-ios-preview
        run: tar -xzf runnit-ios-project.tar.gz && rm runnit-ios-project.tar.gz
      - name: Compile the checked native shell
        working-directory: ${{ runner.temp }}/runnit-ios-preview
        run: bash build-ios-preview.sh --compile-only
      - name: Boot fresh simulator and test React/native bridges
        working-directory: ${{ runner.temp }}/runnit-ios-preview
        run: bash smoke-ios-preview.sh
      - name: Package simulator app with executable permissions
        working-directory: ${{ runner.temp }}/runnit-ios-preview
        run: tar -czf runnit-ios-simulator-app.tar.gz -C derived/Build/Products/Debug-iphonesimulator App.app
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runnit-ios-simulator-app
          path: ${{ runner.temp }}/runnit-ios-preview/runnit-ios-simulator-app.tar.gz
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: runnit-ios-smoke-diagnostics
          path: ${{ runner.temp }}/runnit-ios-preview/smoke/
          retention-days: 7
          if-no-files-found: ignore
