name: Isolated duel SQL validation
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, 'fix/duel-release-integration-20261125']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    name: PostgreSQL duel guard execution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: runnit_test
        options: >-
          --health-cmd "pg_isready -U postgres -d runnit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute isolated SQL fixture
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp db/release-candidates/duel_result_guard.sql "$DB_CONTAINER:/tmp/duel_result_guard.sql"
          docker cp db/release-candidates/beta_ranking_guard.sql "$DB_CONTAINER:/tmp/beta_ranking_guard.sql"
          docker cp db/release-candidates/test_duel_result_guard.sql "$DB_CONTAINER:/tmp/test_duel_result_guard.sql"
          docker exec "$DB_CONTAINER" psql -X -U postgres -d runnit_test -v ON_ERROR_STOP=1 -f /tmp/test_duel_result_guard.sql
      - name: Execute full duel lifecycle and concurrent finishes
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp supabase/migrations/202611100001_guard_duel_cancellation.sql "$DB_CONTAINER:/tmp/cancellation.sql"
          docker cp supabase/migrations/20261116_003_arcade_ready_ten_second_start.sql "$DB_CONTAINER:/tmp/ready.sql"
          docker cp supabase/migrations/20261116_004_abort_matched_duel.sql "$DB_CONTAINER:/tmp/abort.sql"
          docker cp db/release-candidates/duel_integration_setup.sql "$DB_CONTAINER:/tmp/duel_integration_setup.sql"
          bash db/release-candidates/test_duel_integration.sh "$DB_CONTAINER"
      - name: Verify account deletion request permissions
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp db/release-candidates/account_deletion_requests.sql "$DB_CONTAINER:/tmp/account_deletion_requests.sql"
          docker cp db/release-candidates/test_account_deletion_requests.sql "$DB_CONTAINER:/tmp/test_account_deletion_requests.sql"
          docker exec "$DB_CONTAINER" psql -X -U postgres -d runnit_test -v ON_ERROR_STOP=1 -f /tmp/test_account_deletion_requests.sql
      - name: Verify account erasure FK and shared-race safety
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp db/release-candidates/account_erasure_guard.sql "$DB_CONTAINER:/tmp/account_erasure_guard.sql"
          docker cp db/release-candidates/shared_duel_erasure.sql "$DB_CONTAINER:/tmp/shared_duel_erasure.sql"
          docker cp db/release-candidates/test_account_erasure_guard.sql "$DB_CONTAINER:/tmp/test_account_erasure_guard.sql"
          docker exec "$DB_CONTAINER" psql -X -U postgres -d runnit_test -v ON_ERROR_STOP=1 -f /tmp/test_account_erasure_guard.sql
