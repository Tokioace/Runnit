name: Recover reviewed native preview lockfile
on:
  pull_request:
    branches: [develop]
    paths: ['.github/workflows/recover-native-lock.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runnit-ios-preview-input
          run-id: 45668904948
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reviewed-preview
      - name: Recover exact lockfile from successful PR 248 preparation
        working-directory: ${{ runner.temp }}/reviewed-preview
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, tarfile
          with tarfile.open('runnit-ios-project.tar.gz','r:gz') as archive:
              lock = archive.extractfile('./package-lock.json').read()
              manifest = json.load(archive.extractfile('./preview-input-hashes.json'))
              package = json.load(archive.extractfile('./package.json'))
          digest=hashlib.sha256(lock).hexdigest()
          assert digest == manifest['package-lock.json']
          data=json.loads(lock)
          assert data['packages']['']['dependencies']==package['dependencies']
          assert data['packages']['']['devDependencies']==package['devDependencies']
          for name, entry in data['packages'].items():
              if name:
                  assert entry['resolved'].startswith('https://registry.npmjs.org/')
                  assert entry['integrity'].startswith('sha512-')
          encoded=base64.b64encode(lock).decode('ascii')
          print('LOCK_SHA256 '+digest)
          print('LOCK_ENTRIES '+str(len(data['packages'])))
          for i in range(0,len(encoded),800):
              print('LOCK_CHUNK %04d %s' % (i//800,encoded[i:i+800]))
          print('LOCK_END '+str((len(encoded)+799)//800))
          PY
