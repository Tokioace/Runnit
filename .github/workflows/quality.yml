name: Runnit quality checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - develop
      - main
      - 'development/**'
      - 'feature/**'
      - 'fix/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Full automated regression suite
        env:
          NO_COLOR: '1'
        shell: bash
        run: |
          set -o pipefail
          npm run test:gps | tee "$RUNNER_TEMP/runnit-tests.tap"
          node scripts/verify-test-summary.mjs "$RUNNER_TEMP/runnit-tests.tap"
      - name: Production build
        run: npm run build
      - name: Confirm production-style build omits preview identity
        run: test ! -e dist/runnit-build.json
      - name: Build and verify synthetic external beta artifacts
        env:
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: develop
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          RUNNIT_EXTERNAL_BETA: 'true'
          RUNNIT_EXTERNAL_BETA_PROJECT_REF: abcdefghijklmnopqrst
          RUNNIT_EXTERNAL_BETA_ISOLATION_CONFIRMED: 'true'
          VITE_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_synthetic_ci_fixture_12345
          VITE_LEGAL_PAGES_ENABLED: 'true'
          VITE_APPROVED_LEGAL_PAGES_JSON: '{"version":"synthetic-ci","privacy":{"title":"Test","sections":[{"heading":"Test","body":"Synthetic test only."}]},"terms":{"title":"Test","sections":[{"heading":"Test","body":"Synthetic test only."}]},"imprint":{"title":"Test","sections":[{"heading":"Test","body":"Synthetic test only."}]}}'
        run: |
          npm run build
          node --experimental-strip-types scripts/verify-preview-build-identity.mjs dist/runnit-build.json "$VERCEL_GIT_COMMIT_SHA"
          if RUNNIT_EXTERNAL_BETA_ISOLATION_CONFIRMED=false npm run build > "$RUNNER_TEMP/runnit-beta-rejected.log" 2>&1; then
            echo 'Unconfirmed beta build unexpectedly succeeded' >&2
            exit 1
          fi
          grep -Fq 'External beta isolation must be confirmed by operator' "$RUNNER_TEMP/runnit-beta-rejected.log"
