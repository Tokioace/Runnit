name: Runnit quality checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - develop
      - main
      - 'development/**'
      - 'feature/**'
      - 'fix/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Full automated regression suite
        env:
          NO_COLOR: '1'
        shell: bash
        run: |
          set -o pipefail
          npm run test:gps | tee "$RUNNER_TEMP/runnit-tests.tap"
          node scripts/verify-test-summary.mjs "$RUNNER_TEMP/runnit-tests.tap"
      - name: Production build
        run: npm run build
      - name: Confirm production-style build omits preview identity
        run: test ! -e dist/runnit-build.json
      - name: Build and verify develop preview identity
        env:
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: develop
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm run build
          node --experimental-strip-types scripts/verify-preview-build-identity.mjs dist/runnit-build.json "$VERCEL_GIT_COMMIT_SHA"
